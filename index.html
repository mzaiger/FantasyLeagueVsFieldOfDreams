<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#C8102E"/>
<title>Fantasy League vs Field of Dreams</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --lin:#C8102E; --gold:#F2C14E;
    --glass:rgba(10,12,18,.55); --glass-hi:rgba(255,255,255,.14);
    --stroke:rgba(255,255,255,.20); --txt:#fff; --txt-dim:rgba(255,255,255,.72);
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#0a0d12}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--txt);
    touch-action:manipulation;user-select:none;-webkit-user-select:none;
  }
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none}

  .glass{
    background:linear-gradient(155deg,var(--glass-hi),rgba(255,255,255,.03)),var(--glass);
    border:1px solid var(--stroke);backdrop-filter:blur(14px) saturate(1.25);
    -webkit-backdrop-filter:blur(14px) saturate(1.25);border-radius:16px;box-shadow:var(--shadow);
  }

  /* ---------- Score bug ---------- */
  #scorebug{
    position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));
    padding:9px 13px;display:flex;flex-direction:column;gap:6px;z-index:20;min-width:158px;
  }
  #sb-rows{display:flex;flex-direction:column;gap:3px}
  .sb-row{display:flex;align-items:center;gap:7px;font-family:'Barlow Condensed';font-weight:700;font-size:17px;letter-spacing:.4px;line-height:1}
  .sb-chip{width:11px;height:11px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);flex:none}
  .sb-team{flex:1;font-size:15px}
  .sb-runs{font-size:19px;font-weight:800;min-width:16px;text-align:right}
  #sb-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.14)}
  #sb-inning{font-family:'Barlow Condensed';font-weight:700;font-size:15px;color:var(--txt-dim);letter-spacing:.5px}
  #sb-count{display:flex;gap:9px;align-items:center}
  .pipset{display:flex;gap:3px}
  .pip{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);transition:background .15s}

  /* ---------- Base diamond ---------- */
  #sb-diamond{
    --bd:12px;
    display:grid;align-self:stretch;justify-content:center;justify-items:center;align-items:center;
    grid-template-columns:repeat(3,var(--bd));grid-template-rows:var(--bd) var(--bd) auto;
    gap:6px;padding-top:7px;border-top:1px solid rgba(255,255,255,.10);
  }
  #sb-diamond .base{
    width:var(--bd);height:var(--bd);border-radius:2.5px;
    border:1.5px solid rgba(255,255,255,.32);background:rgba(255,255,255,.08);
    transform:rotate(45deg) scale(.84);
    transition:background-color .22s,border-color .22s,box-shadow .22s;
  }
  #sb-diamond .base.on{
    background:var(--occ,#fff);border-color:rgba(255,255,255,.55);
    box-shadow:0 0 8px var(--occ-glow,rgba(255,255,255,.55)),inset 0 0 3px rgba(255,255,255,.35);
  }
  #sb-diamond .base.pop{animation:bdpop .42s cubic-bezier(.2,1.5,.4,1)}
  @keyframes bdpop{
    0%{transform:rotate(45deg) scale(.84)}
    45%{transform:rotate(45deg) scale(1.32)}
    100%{transform:rotate(45deg) scale(.84)}
  }
  #sb-diamond .b1{grid-area:2/3}   /* first base — right  */
  #sb-diamond .b2{grid-area:1/2}   /* second base — top   */
  #sb-diamond .b3{grid-area:2/1}   /* third base — left   */
  #sb-diamond .hp{                 /* home plate notch — bottom */
    grid-area:3/2;width:calc(var(--bd)*.92);height:calc(var(--bd)*.85);
    background:rgba(255,255,255,.30);clip-path:polygon(50% 100%,100% 42%,79% 0,21% 0,0 42%);
  }
  @media (max-width:560px){#sb-diamond{--bd:9px;gap:5px;padding-top:6px}}

  /* ---------- Matchup ---------- */
  #matchup{
    position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
    z-index:19;padding:7px 14px;display:flex;gap:14px;align-items:center;white-space:nowrap;
  }
  .mu{display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .mu-lab{font-size:9px;letter-spacing:1.6px;color:var(--txt-dim);font-weight:600}
  .mu-nam{font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.5px}
  .mu-vs{color:var(--txt-dim);font-size:11px;font-weight:800}

  /* ---------- Stat line ---------- */
  #statline{
    position:fixed;top:calc(64px + env(safe-area-inset-top));right:calc(66px + env(safe-area-inset-right));
    z-index:20;padding:8px 13px;display:flex;gap:12px;opacity:0;transition:opacity .35s;pointer-events:none;
  }
  .stat{display:flex;flex-direction:column;align-items:center;line-height:1.1}
  .stat b{font-family:'Barlow Condensed';font-size:19px;font-weight:800;color:var(--gold)}
  .stat span{font-size:8.5px;letter-spacing:1.4px;color:var(--txt-dim);font-weight:600}

  /* ---------- Banner ---------- */
  #banner{
    position:fixed;left:50%;top:33%;z-index:30;text-align:center;pointer-events:none;
    transform:translate(-50%,-50%);opacity:0;width:100vw;
  }
  #banner.pop{animation:bpop var(--bd,1.5s) cubic-bezier(.2,1.4,.35,1) forwards}
  @keyframes bpop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.55) rotate(-2deg)}
    12%{opacity:1;transform:translate(-50%,-50%) scale(1.07) rotate(.4deg)}
    22%{transform:translate(-50%,-50%) scale(1)}
    80%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-56%) scale(.97)}
  }
  .ban-main{font-family:'Barlow Condensed';font-weight:800;letter-spacing:5px;text-transform:uppercase;
    font-size:clamp(34px,7.5vw,66px);text-shadow:0 4px 26px rgba(0,0,0,.55),0 0 60px rgba(208,0,0,.25)}
  .ban-sub{font-family:'Barlow Condensed';font-weight:600;font-size:clamp(13px,2.6vw,20px);letter-spacing:4px;
    color:rgba(255,255,255,.88);text-shadow:0 2px 12px rgba(0,0,0,.5);margin-top:2px}
  .b-strike .ban-main{color:#ffd23e}.b-ball .ban-main{color:#7ec8ff}
  .b-out .ban-main{color:#ff6b5e}.b-hit .ban-main{color:#7dffa8}
  .b-hr .ban-main{color:var(--gold);text-shadow:0 0 42px rgba(242,193,78,.65),0 4px 24px rgba(0,0,0,.55)}

  /* ---------- Distance popup ---------- */
  #distpop{
    position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);z-index:29;pointer-events:none;
    font-family:'Barlow Condensed';font-weight:800;font-size:clamp(22px,4.5vw,36px);letter-spacing:2px;
    color:#fff;text-shadow:0 3px 18px rgba(0,0,0,.6);opacity:0;transition:opacity .5s;
  }

  /* ---------- Toasts ---------- */
  #toasts{position:fixed;left:calc(12px + env(safe-area-inset-left));bottom:calc(150px + env(safe-area-inset-bottom));z-index:18;display:flex;flex-direction:column-reverse;gap:6px;max-width:min(320px,74vw)}
  .toast{padding:8px 13px;font-size:12.5px;font-weight:600;border-left:3px solid var(--lin);animation:tin .3s ease-out,tout .5s ease-in 4.6s forwards}
  @keyframes tin{from{opacity:0;transform:translateX(-14px)}}
  @keyframes tout{to{opacity:0;transform:translateX(-14px)}}

  /* ---------- Action button ---------- */
  #actionwrap{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:25;display:flex;flex-direction:column;align-items:center;gap:8px}
  #actionBtn{
    width:clamp(86px,13vw,104px);height:clamp(86px,13vw,104px);border-radius:50%;
    border:2px solid rgba(255,255,255,.45);cursor:pointer;position:relative;
    background:radial-gradient(circle at 32% 28%,#ff5a6e,#C8102E 58%,#6e0009);
    box-shadow:0 10px 26px rgba(200,16,46,.45),inset 0 -6px 14px rgba(0,0,0,.35),inset 0 4px 10px rgba(255,255,255,.32);
    color:#fff;font-family:'Barlow Condensed';font-weight:800;letter-spacing:1.2px;
    font-size:clamp(14px,2.4vw,18px);line-height:1.05;transition:transform .09s,filter .2s;
    touch-action:manipulation;
  }
  #actionBtn:active{transform:scale(.92)}
  #actionBtn:disabled{filter:saturate(.15) brightness(.62);pointer-events:none}
  #actionBtn .sub{display:block;font-size:11px;letter-spacing:2px;font-weight:600;opacity:.85;margin-top:3px}
  #hint{font-size:10.5px;letter-spacing:1.6px;color:rgba(255,255,255,.66);text-shadow:0 1px 6px rgba(0,0,0,.6);font-weight:600}

  /* ---------- Drawer toggle — Husker red chip, white bars ---------- */
  #drawerToggle{
    position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));
    z-index:40;width:44px;height:44px;border-radius:14px;cursor:pointer;
    background:var(--lin);border:1px solid rgba(255,255,255,.30);
    box-shadow:0 3px 12px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;touch-action:manipulation;
    transition:background .18s,transform .12s,box-shadow .18s;
  }
  #drawerToggle:hover{background:#d91536;box-shadow:0 4px 16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28)}
  #drawerToggle:active{background:#9d0c25;transform:scale(.94)}
  #drawerToggle i{display:block;width:19px;height:2.5px;border-radius:2px;background:#fff;transition:transform .3s,opacity .3s}
  body.drawer-open #drawerToggle i:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
  body.drawer-open #drawerToggle i:nth-child(2){opacity:0}
  body.drawer-open #drawerToggle i:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

  /* ---------- Roster drawer ---------- */
  #drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(340px,90vw);z-index:35;
    transform:translateX(106%);transition:transform .38s cubic-bezier(.3,1,.3,1);
    background:linear-gradient(165deg,rgba(16,18,26,.92),rgba(8,9,14,.94));
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-left:1px solid var(--stroke);overflow-y:auto;padding:calc(68px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)) 20px;
  }
  body.drawer-open #drawer{transform:none}
  #drawer h2{font-family:'Barlow Condensed';font-weight:800;font-size:23px;letter-spacing:1.5px;display:flex;align-items:center;gap:9px}
  #drawer h2 .dot{width:14px;height:14px;border-radius:4px;flex:none}
  .rosec{margin:14px 0 4px;font-size:10px;letter-spacing:2.2px;color:var(--txt-dim);font-weight:700}
  .rrow{display:flex;align-items:center;gap:10px;padding:6.5px 9px;margin:3px 0;border-radius:10px;background:rgba(255,255,255,.05)}
  .rrow.atbat{background:rgba(242,193,78,.16);outline:1px solid rgba(242,193,78,.4)}
  .rnum{font-family:'Barlow Condensed';font-weight:800;font-size:14px;width:20px;color:var(--gold);text-align:right;flex:none}
  .rpos{font-size:9.5px;letter-spacing:1px;color:var(--txt-dim);width:84px;font-weight:600;text-transform:uppercase;flex:none}
  .rname{font-family:'Barlow Condensed';font-weight:700;font-size:16.5px;letter-spacing:.4px;flex:1}
  .rtag{font-size:8.5px;letter-spacing:1px;color:#0a0d12;background:var(--gold);padding:2px 6px;border-radius:6px;font-weight:800}

  /* ---------- Final overlay ---------- */
  #final{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(5,6,10,.45);opacity:0;pointer-events:none;transition:opacity .5s}
  #final.show{opacity:1;pointer-events:auto}
  #finalCard{padding:34px 44px;text-align:center;max-width:88vw}
  #f-res{font-family:'Barlow Condensed';font-weight:800;font-size:clamp(38px,8vw,64px);letter-spacing:3px}
  #f-score{font-family:'Barlow Condensed';font-weight:700;font-size:clamp(22px,4.5vw,32px);color:var(--txt-dim);margin:6px 0 20px}
  #againBtn{
    border:0;cursor:pointer;padding:13px 34px;border-radius:999px;font-family:'Barlow Condensed';
    font-weight:800;font-size:18px;letter-spacing:2px;color:#fff;
    background:linear-gradient(160deg,#ff5a5a,#B00000);box-shadow:0 8px 22px rgba(208,0,0,.5);touch-action:manipulation;
  }
  #againBtn:active{transform:scale(.95)}

  /* ---------- Boot / error — the home page ----------
     Night-game vignette: outfield-grass green rising into a navy sky, two
     faint LIN-red dashed seam-stitch arcs (::before/::after), and a cream
     athletic headline that pops by weight and contrast (owner: "Lincoln
     doesn't need to be red — make it pop"). League red #C8102E is reserved
     for small accents (underline, stitches, bar). Pure CSS, no assets;
     font stacks fall back gracefully when offline. */
  #boot{
    position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;overflow:hidden;transition:opacity .6s;
    background:
      radial-gradient(130% 74% at 50% 114%, rgba(24,78,40,.52), rgba(24,78,40,0) 62%),
      radial-gradient(150% 96% at 50% -28%, rgba(16,44,90,.55), rgba(16,44,90,0) 60%),
      linear-gradient(180deg,#0a1424 0%,#0a1a1e 46%,#0b1f12 100%);
  }
  #boot.hide{opacity:0;pointer-events:none}
  /* Seam-stitch lacing — two huge dashed circles; only the near arc shows */
  #boot::before,#boot::after{
    content:'';position:absolute;left:50%;width:150vmax;height:150vmax;border-radius:50%;
    border:3px dashed rgba(200,16,46,.14);pointer-events:none;
  }
  #boot::before{top:-137vmax;transform:translateX(-50%)}
  #boot::after{bottom:-139vmax;transform:translateX(-50%)}
  /* Title — three stacked lines (club / vs / club); clamp()/vw sizing keeps
     every line intact on laptop widths. Cream, heavy, tight — depth from a
     soft drop shadow plus a faint warm glow; one brand nod: the red rule. */
  #boot .title{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    font-family:'Barlow Condensed','Arial Narrow',Impact,'Segoe UI',sans-serif;font-weight:800;
    font-size:clamp(34px,6vw,78px);letter-spacing:.045em;line-height:1.04;text-align:center;
    color:#F4EFE2;
    text-shadow:0 3px 22px rgba(0,0,0,.65),0 0 44px rgba(255,214,140,.14)
  }
  #boot .title .vs{
    font-size:.3em;font-weight:700;letter-spacing:.62em;text-indent:.62em;
    color:rgba(244,239,226,.55);text-shadow:none
  }
  #boot .title::after{
    content:'';width:78px;height:3px;border-radius:3px;margin-top:12px;
    background:var(--lin);box-shadow:0 0 16px rgba(200,16,46,.55)
  }
  #boot .bar{width:min(260px,60vw);height:4px;border-radius:4px;background:rgba(244,239,226,.13);overflow:hidden}
  #boot .bar i{display:block;height:100%;width:30%;border-radius:4px;background:var(--lin);box-shadow:0 0 12px rgba(200,16,46,.7);animation:load 1.1s ease-in-out infinite alternate}
  @keyframes load{from{transform:translateX(-40%)}to{transform:translateX(240%)}}
  #boot .msg{font-size:11px;letter-spacing:2.4px;color:rgba(244,239,226,.6)}

  /* ---------- Stadium picker (boot screen) ---------- */
  #parkpick{display:none;flex-direction:column;gap:14px;align-items:center}
  #parkpick.show{display:flex}
  .pp-head{font-size:11px;letter-spacing:3.4px;color:rgba(244,239,226,.66);font-weight:700;position:relative;padding-bottom:9px}
  .pp-head::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:46px;height:1px;background:rgba(244,239,226,.32)}
  .pp-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .pp-card{
    width:260px;padding:20px 16px 17px;border-radius:16px;cursor:pointer;
    display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;
    background:linear-gradient(155deg,rgba(255,255,255,.10),rgba(255,255,255,.02)),rgba(10,12,18,.72);
    border:1px solid var(--stroke);color:#fff;font-family:'Barlow Condensed';
    box-shadow:0 6px 20px rgba(0,0,0,.4);
    transition:transform .13s,border-color .18s,box-shadow .18s;
  }
  .pp-card:hover{transform:translateY(-3px);border-color:var(--lin);box-shadow:0 12px 30px rgba(200,16,46,.32)}
  .pp-card:active{transform:translateY(0) scale(.97)}
  .pp-card:focus-visible{outline:2px solid var(--lin);outline-offset:3px}
  .pp-name{font-weight:800;font-size:22px;letter-spacing:2px;line-height:1.05}
  .pp-card[data-park="oracle"] .pp-name{color:#ff7a8c}
  .pp-card[data-park="fod"] .pp-name{color:#8fbf6f}
  .pp-team{font-family:'Barlow Condensed';font-weight:700;font-size:13.5px;letter-spacing:2.2px;color:var(--gold);line-height:1.2;white-space:nowrap}
  .pp-sub{font-size:9.5px;letter-spacing:1.6px;color:var(--txt-dim);font-weight:600;line-height:1.5}
  .pp-tag{font-size:9px;letter-spacing:1.4px;font-weight:600;font-style:italic;color:rgba(244,239,226,.52);line-height:1.4}

  @media (max-width:560px){
    #matchup{top:auto;bottom:calc(148px + env(safe-area-inset-bottom));padding:5px 10px;gap:10px}
    .mu-nam{font-size:14px}
    #statline{top:calc(112px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right))}
    #scorebug{min-width:132px;padding:7px 10px}
    .sb-team{font-size:13px}
    #toasts{bottom:auto;top:calc(150px + env(safe-area-inset-top))}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="scorebug" class="glass">
  <div id="sb-rows"></div>
  <div id="sb-meta">
    <span id="sb-inning">▼ 1</span>
    <div id="sb-count">
      <div class="pipset" id="pips-b"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
      <div class="pipset" id="pips-s"><i class="pip"></i><i class="pip"></i></div>
      <div class="pipset" id="pips-o"><i class="pip"></i><i class="pip"></i><i class="pip"></i></div>
    </div>
  </div>
  <div id="sb-diamond" aria-hidden="true">
    <span class="base b1"></span><span class="base b2"></span><span class="base b3"></span><span class="hp"></span>
  </div>
</div>

<div id="matchup" class="glass">
  <div class="mu"><span class="mu-lab">AT BAT</span><span class="mu-nam" id="mu-bat">—</span></div>
  <span class="mu-vs">VS</span>
  <div class="mu"><span class="mu-lab">PITCHING</span><span class="mu-nam" id="mu-pit">—</span></div>
</div>

<div id="statline" class="glass">
  <div class="stat"><b id="st-ev">—</b><span>EXIT VEL</span></div>
  <div class="stat"><b id="st-la">—</b><span>LAUNCH</span></div>
  <div class="stat"><b id="st-dist">—</b><span>DIST</span></div>
</div>

<div id="banner"><div class="ban-main"></div><div class="ban-sub"></div></div>
<div id="distpop"></div>
<div id="toasts"></div>

<button id="drawerToggle" aria-label="Roster"><i></i><i></i><i></i></button>
<div id="drawer"></div>

<div id="actionwrap">
  <button id="actionBtn" disabled>PLAY<span class="sub">BALL</span></button>
  <div id="hint">SPACE / TAP — TIME THE SWING</div>
</div>

<div id="final"><div id="finalCard" class="glass">
  <div id="f-res">FINAL</div>
  <div id="f-score"></div>
  <button id="againBtn">PLAY AGAIN ⟳</button>
</div></div>

<div id="boot">
  <div class="title">
    <div>FANTASY LEAGUE</div>
    <div class="vs">VS</div>
    <div>FIELD OF DREAMS</div>
  </div>
  <div class="msg" id="bootmsg">BUILDING BALLPARK…</div>
  <div id="parkpick">
    <div class="pp-head">PICK THE BALLPARK</div>
    <div class="pp-cards">
      <button class="pp-card" data-park="oracle">
        <span class="pp-name">ORACLE PARK</span>
        <span class="pp-team">Fantasy League's<br>Home Park</span>
        <span class="pp-sub">San Francisco, CA</span>
        <span class="pp-tag">City Skyline by the Bay!</span>
      </button>
      <button class="pp-card" data-park="fod">
        <span class="pp-name">FIELD OF DREAMS</span>
        <span class="pp-team">Shoeless Joe Jackson's<br>Home Park</span>
        <span class="pp-sub">Dyersville, IA</span>
        <span class="pp-tag">Corn and Farm Houses!</span>
      </button>
    </div>
  </div>
  <div class="bar" id="bootbar" style="visibility:hidden"><i></i></div>
</div>

<script type="importmap">
{"imports":{
  "three":"./lib/three/three.module.js",
  "three/addons/":"./lib/three/examples/jsm/"
}}
</script>

<!-- Modular Gauntlet engine entry -->
<script type="module" src="./js/main.js"></script>
</body>
</html>
